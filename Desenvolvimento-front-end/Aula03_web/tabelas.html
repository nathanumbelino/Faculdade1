<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de tabela</title>
</head>
<body>
    <h1>Tabelas de Html</h1>
    <p>
        as tabelas de HTML são usadas para <br>
        organizar dados em linhas e colunas.
    </p>

    <table border = "1">
    
        <thead>
            <tr>
                <th>nome</th>
                <th>idade</th>  
                <th>cidade</th>             
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <td>nathan</td>
                <td>20</td>
                <td>Guarulhos</td>
            </tr>
            <tr>
                <td>Maycoy</td>
                <td>25</td>
                <td>Campo da paz</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
