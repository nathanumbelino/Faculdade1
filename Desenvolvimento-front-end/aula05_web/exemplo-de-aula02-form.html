<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de um Formulario</title>
</head>
<body>
    <h1>Cadastro do Estudante</h1>

    <form> 
        <p>
            <label for="nome">Nome:</label>
            <input 
            type = "text"
            id = "nome"
            name=" nome"
            required
        
        >    
        </p>
        <p>
        <label for="email">E-mail:</label>
        <input
            type = "email"
            id = "email"
            name = "email"
            required
        >
        <p>
        
            <label for="senha">E-mail:</label>
            <input
            type = "password"
            id = "senha"
            name = "senha"
            required>
        </p>

        <div>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </div>








        
    </form>
</body>
</html>
