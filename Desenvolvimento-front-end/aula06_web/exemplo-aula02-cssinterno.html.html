<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de classes e CSS interno</title>
    <style>
        .titulo{
            color: rgb(196, 45, 45);
            text-align: center;
        }
        .titulo2{
            color: rgb(61, 16, 224);
            text-align: center;
        }

        .caixa01{
            background-color: azure;
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }

        .caixa02{
            background-color: rgb(174, 235, 172);
            border: 2px solid rgb(78, 3, 3);
            padding: 20px;
            margin: 20px;
        }
        .destaque01{
            color:blueviolet;
            font-weight: bold;
        }
        .destaque02{
            color:rgb(20, 81, 172);
            font-weight: italic;
            background-color: honeydew;
            padding: 10px;
        }
        

    </style>
</head>
<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>
    <div class="caixa01">
        <p>
            Estou aprendendo a utilizar classes para personalizar
            os elementos de uma página.
        </p>
        <br>
        <p class="destaque01">
            Este parágrafo utiliza a classe destaque01
        </p>
       
    </div>

    <h1 class="titulo2">Classes em CSS</h1>
    <div class="caixa02">
        <p>
            Este parágrafo não utiliza nenhuma classe
        </p>
        <br>
        <p class="destaque02">
            Este parágrafo utiliza a classe destaque02
        </p>
    </div>

</body>
</html>
