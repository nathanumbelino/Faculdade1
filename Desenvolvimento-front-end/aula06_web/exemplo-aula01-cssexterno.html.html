<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo CSS externo</title>
    <link rel="stylesheet" href="estilo.css"/>
</head>
<body>
<h1>Minha primeira página com estilo</h1>
    <section>
        <!--
        Títulos = h1/h2/h3/h4/h5/h6
        Parágrafo = p
        Adicionar seção - section
        -->
        <h2>Aprendendo CSS externo</h2>

            <p>
                Estou aprendendo CSS externo para personalizar
                minhas páginas.
            </p>
            <p>
                O HTML é a estrutura, enquando o CSS é o estilo.
            </p>

            <!-- 
            Medida de segurança = noopener
            Abrir em outra guia do navegador = _blank
            Encaminhar para um site = href
            criar link clicavel = <a
            padding = fica entre o texto
            arredondar borda =  border-radius:
            -->
            <a 
                href="https://web.dev/css?hl=pt-br"
                target="_blank"
                rel="noopener"
                >
                Saiba mais sobre CSS.
            </a>
    </section>
</body>
</html>
